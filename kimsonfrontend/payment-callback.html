<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Status - Kinmson Int'l Success Venture</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .payment-status-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .payment-status-card {
            background: white;
            border-radius: 16px;
            padding: 3rem;
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }
        .status-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
        }
        .status-icon.success { color: #16A34A; }
        .status-icon.failed { color: #EF4444; }
        .status-icon.loading { color: #F4B400; }
        .payment-status-card h2 {
            margin-bottom: 1rem;
            color: #0B1F3A;
        }
        .payment-status-card p {
            color: #64748B;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            padding: 0.875rem 2rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }
        .btn-primary {
            background: #0B1F3A;
            color: white;
        }
        .btn-primary:hover {
            background: #1a3a5c;
            transform: translateY(-2px);
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="payment-status-container">
        <div class="payment-status-card">
            <div class="status-icon loading" id="statusIcon">
                <i class="fas fa-spinner fa-spin"></i>
            </div>
            <h2 id="statusTitle">Verifying Payment...</h2>
            <p id="statusMessage">Please wait while we verify your payment.</p>
            <a href="index.html" class="btn btn-primary" id="actionBtn" style="display: none;">
                Return to Store
            </a>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000/api';
        
        async function verifyPayment() {
            const urlParams = new URLSearchParams(window.location.search);
            const reference = urlParams.get('reference');
            
            if (!reference) {
                showStatus('failed', 'Payment Failed', 'No payment reference found. Please contact support if you were charged.');
                return;
            }
            
            try {
                const res = await fetch(`${API_BASE}/payment/verify/${reference}`);
                const data = await res.json();
                
                if (data.success) {
                    sessionStorage.removeItem('pendingCart');
                    sessionStorage.removeItem('pendingOrderId');
                    showStatus('success', 'Payment Successful!', `Thank you for your payment of ₦${data.data.amount.toLocaleString()}. Your order has been confirmed and will be processed shortly.`);
                } else {
                    showStatus('failed', 'Payment Failed', data.message || 'We could not verify your payment. Please contact support.');
                }
            } catch (err) {
                showStatus('failed', 'Error', 'An error occurred while verifying your payment. Please contact support.');
            }
        }
        
        function showStatus(type, title, message) {
            const icon = document.getElementById('statusIcon');
            const titleEl = document.getElementById('statusTitle');
            const messageEl = document.getElementById('statusMessage');
            const actionBtn = document.getElementById('actionBtn');
            
            icon.className = 'status-icon ' + type;
            
            if (type === 'success') {
                icon.innerHTML = '<i class="fas fa-check-circle"></i>';
            } else if (type === 'failed') {
                icon.innerHTML = '<i class="fas fa-times-circle"></i>';
            } else {
                icon.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            }
            
            titleEl.textContent = title;
            messageEl.textContent = message;
            actionBtn.style.display = 'inline-block';
        }
        
        document.addEventListener('DOMContentLoaded', verifyPayment);
    </script>
</body>
</html>
