<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset your password for Kinmson Admin Panel">
    <title>Reset Password - Kinmson Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <style>
        .reset-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary) 0%, #0f172a 50%, var(--accent) 100%);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        .reset-form {
            background: var(--white);
            padding: 45px;
            border-radius: 20px;
            box-shadow: var(--shadow-xl);
            width: 100%;
            max-width: 450px;
            position: relative;
        }
        .reset-header {
            text-align: center;
            margin-bottom: 35px;
        }
        .reset-header .icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            color: var(--white);
            font-size: 30px;
        }
        .reset-header h2 {
            color: var(--primary);
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .reset-header p {
            color: var(--gray-500);
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 24px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text);
            font-size: 14px;
        }
        .reset-form input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #E2E8F0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #F8FAFC;
            color: var(--text);
        }
        .reset-form input:focus {
            border-color: var(--primary);
            outline: none;
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(11, 31, 58, 0.08);
        }
        .btn-reset {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            background: var(--primary);
            border: none;
            border-radius: 10px;
            color: var(--white);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-reset:hover {
            background: #0f172a;
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(11, 31, 58, 0.2);
        }
        .back-to-login {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 22px;
            color: var(--primary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        .back-to-login:hover {
            color: var(--accent);
        }
        .password-requirements {
            background: #F8FAFC;
            border-radius: 8px;
            padding: 12px 16px;
            margin-top: 10px;
            font-size: 12px;
            color: var(--gray-500);
            border-left: 3px solid var(--secondary);
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="reset-form">
            <div class="reset-header">
                <div class="icon">
                    <i class="fas fa-key"></i>
                </div>
                <h2>Reset Your Password</h2>
                <p>Enter your new password below</p>
            </div>

            <form id="resetForm">
                <input type="hidden" id="resetTokenFromUrl">

                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" placeholder="Enter new password" required minlength="6">
                    <div class="password-requirements">
                        Password must be at least 6 characters long
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm new password" required minlength="6">
                </div>

                <button type="submit" class="btn-reset" id="resetSubmitBtn">Reset Password</button>
            </form>

            <a href="admin.html" class="back-to-login">
                <i class="fas fa-arrow-left"></i> Back to Login
            </a>
        </div>
    </div>

    <script>
        const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost:5000/api'
            : '/api';

        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        document.getElementById('resetTokenFromUrl').value = token || '';

        if (!token) {
            window.location.href = 'admin.html';
        }

        const resetForm = document.getElementById('resetForm');
        const resetSubmitBtn = document.getElementById('resetSubmitBtn');

        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                alert('Passwords do not match');
                return;
            }

            if (password.length < 6) {
                alert('Password must be at least 6 characters');
                return;
            }

            resetSubmitBtn.textContent = 'Resetting...';
            resetSubmitBtn.disabled = true;

            try {
                const res = await fetch(`${API_BASE}/auth/resetpassword/${token}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const data = await res.json();

                if (data.success) {
                    alert('Password reset successfully! Please log in.');
                    window.location.href = 'admin.html';
                } else {
                    alert(data.message || 'Reset failed. Please try again.');
                }
            } catch (err) {
                alert('Error: ' + err.message);
            } finally {
                resetSubmitBtn.disabled = false;
                resetSubmitBtn.textContent = 'Reset Password';
            }
        });
    </script>
</body>
</html>
